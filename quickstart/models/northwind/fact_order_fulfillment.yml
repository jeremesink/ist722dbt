version: 2

models:
  - name: fact_order_fulfillment
    description: "Order level fact table. One row per order; does not include product but tracks order fulfillment."
    columns:
      - name: OrderId
        description: "Degenerate dimension for the order."
        tests:
          - unique
          - not_null

      - name: customerkey
        description: "Dimension key for dim_customer."

      - name: employeekey
        description: "Dimension key for dim_employee."

      - name: orderdatekey
        description: "Role-play Order Date Dimension key for dim_date."

      - name: requireddatekey
        description: "Role-play Required Date Dimension key for dim_date."

      - name: shippeddatekey
        description: "Role-play Shipped Date Dimension key for dim_date."

      - name: quantity
        description: "Additive fact for total quantity of product sold on order."

      - name: totalorderamount
        description: "Additive fact for total amount of product on order (quantity * product price - discount)."

      - name: daysfromordertoshipped
        description: "Number of days elapsed from order to shipped."

      - name: daysfromordertorequired
        description: "Number of days before the order is required."

      - name: shippedtorequireddelta
        description: "Difference between shipped and required; positive means shipment was late."

      - name: shippedontime
        description: "Yes/no flag indicating whether the shipment was on time."
